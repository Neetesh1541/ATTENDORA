version: '3.8'

services:
  # ─── 1. PostgreSQL Database ────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: attendora-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-attendora}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-attendora}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - attendora-network

  # ─── 2. FastAPI Backend & AI Vision Engine ────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: attendora-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-attendora}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-attendora}
      SECRET_KEY: ${SECRET_KEY:-your-super-secret-key-change-in-production-min-32-chars}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      APP_NAME: ATTENDORA
      APP_VERSION: 1.0.0
      DEBUG: "false"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173}
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_SIZE_MB: 10
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-admin@attendora.com}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-Admin@12345}
      FACE_RECOGNITION_TOLERANCE: 0.45
      FACE_RECOGNITION_MODEL: hog
      MIN_FACE_CONFIDENCE: 0.6
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    networks:
      - attendora-network

  # ─── 3. React Frontend & Nginx Reverse Proxy ──────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: attendora-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - attendora-network

volumes:
  pgdata:
    driver: local
  uploads_data:
    driver: local

networks:
  attendora-network:
    driver: bridge

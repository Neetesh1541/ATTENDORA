# ATTENDORA Render.com Blueprint Spec
# Deploy full stack with managed PostgreSQL, FastAPI backend, and React static frontend

services:
  # ─── FastAPI Backend ────────────────────────────────────────────────────────
  - type: web
    name: attendora-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: standard
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: attendora-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 480
      - key: DEBUG
        value: false
      - key: APP_NAME
        value: ATTENDORA
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: SUPER_ADMIN_EMAIL
        value: admin@attendora.com
      - key: SUPER_ADMIN_PASSWORD
        generateValue: true
    disk:
      name: attendora-media
      mountPath: /app/uploads
      sizeGB: 10

  # ─── React Frontend Static Site ────────────────────────────────────────────
  - type: web
    name: attendora-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://attendora-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://attendora-backend.onrender.com/api

databases:
  # ─── Managed PostgreSQL Database ───────────────────────────────────────────
  - name: attendora-postgres
    plan: standard
    databaseName: attendora
    user: postgres
    region: oregon
